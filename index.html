<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Access clasa a X-a</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bară de sus fixă + cuprins lateral (ore pe unități) + zonă de lucru; pe telefon cuprinsul devine sertar */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --sunk:#ececf1; --ink:#1d1b24; --muted:#5f5b6b; --line:#dddbe4; --line-strong:#c6c3d0;
  --accent:#9a1c33; --accent-ink:#ffffff; --accent-soft:#f7e7ea; --accent-text:#8a1830;
  --ok:#1d7353; --ok-soft:#e3f3ec; --bad:#b4271f; --bad-soft:#fbe9e7; --warn:#9a5a00; --warn-soft:#fbf0dc;
  --info:#24618f; --info-soft:#e5eff8;
  --grid-head:#eceaf1; --sel:#fde9b8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
  --r:10px; --shadow:0 1px 2px rgba(30,20,40,.06),0 4px 14px rgba(30,20,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131218; --surface:#1b1a21; --sunk:#24222c; --ink:#ecebf2; --muted:#a6a2b3; --line:#2f2d38; --line-strong:#423f4d;
  --accent:#d6445e; --accent-ink:#ffffff; --accent-soft:#3a1820; --accent-text:#f08597;
  --ok:#47b98c; --ok-soft:#173327; --bad:#f07068; --bad-soft:#3a1a18; --warn:#e2a14a; --warn-soft:#352813;
  --info:#6fb0e3; --info-soft:#16283a; --grid-head:#25232d; --sel:#4a3a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131218; --surface:#1b1a21; --sunk:#24222c; --ink:#ecebf2; --muted:#a6a2b3; --line:#2f2d38; --line-strong:#423f4d;
  --accent:#d6445e; --accent-ink:#ffffff; --accent-soft:#3a1820; --accent-text:#f08597;
  --ok:#47b98c; --ok-soft:#173327; --bad:#f07068; --bad-soft:#3a1a18; --warn:#e2a14a; --warn-soft:#352813;
  --info:#6fb0e3; --info-soft:#16283a; --grid-head:#25232d; --sel:#4a3a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:650;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:650}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--sunk);padding:.08em .38em;border-radius:5px}
kbd{font-family:var(--f-mono);font-size:.8em;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:.05em .4em;white-space:nowrap}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- bara de sus ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;height:58px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);margin-top:-3px}
.topnav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.topnav a{padding:7px 11px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.93rem;white-space:nowrap}
.topnav a:hover{background:var(--sunk);color:var(--ink)}
.topnav a.on{color:var(--accent-text);background:var(--accent-soft)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer}
@media (max-width:980px){.topnav{display:none}.menu-btn{display:grid;place-items:center;margin-left:auto}}

/* ---------- structura ---------- */
.shell{display:grid;grid-template-columns:282px minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:calc(100% - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:calc(58px + env(safe-area-inset-top,0px));height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 30px max(12px,env(safe-area-inset-left,0px))}
.side .mnav{display:none}
.unit-h{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.side a.lk{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.25}
.side a.lk:hover{background:var(--sunk)}
.side a.lk.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.side .num{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;padding:2px 0;background:var(--bg)}
.side a.on .num{border-color:var(--accent);color:var(--accent-text)}
.ring{width:16px;height:16px}
.side-tools{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:calc(58px + env(safe-area-inset-top,0px)) auto 0 0;width:min(320px,88vw);height:auto;z-index:30;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .side .mnav{display:block}
  .scrim{position:fixed;inset:0;background:rgba(10,8,14,.4);z-index:25}
}
.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:22px}
.wrap.wide{max-width:1180px}
.wrap > *,.prose > *,#tabBody > *,.ex > *,.ex-body > *,.unit > *,.hero > *,.sheet-b > *,.req .rb > *,.qbe-out > *,section > *,.rep-host,.dsx{min-width:0}

/* ---------- acasă ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding:8px 0 6px}
.hero p.lead{font-size:1.12rem;color:var(--muted);max-width:52ch;margin-top:12px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.relwin{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.relwin .cap{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.78rem;color:var(--muted)}
.relwin svg{width:100%;height:auto;display:block}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.stats div b{font-family:var(--f-display);font-size:1.6rem;display:block;line-height:1}
.stats div span{font-size:.85rem;color:var(--muted)}
.unit{display:grid;gap:12px}
.unit-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.unit-head .tag{font-family:var(--f-mono);font-size:.8rem;color:var(--accent-text)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 13px;text-decoration:none;color:var(--ink);transition:border-color .15s, transform .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.lcard .row{display:flex;justify-content:space-between;align-items:center}
.lcard .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.lcard h3{font-size:1.02rem}
.lcard p{font-size:.88rem;color:var(--muted);line-height:1.4}
.bar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:6px}
.tool:hover{border-color:var(--accent)}
.tool p{font-size:.9rem;color:var(--muted)}

/* ---------- butoane, câmpuri ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn{max-width:100%}
.term dd,.term dt{min-width:0}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- lecție ---------- */
.lhead{display:grid;gap:10px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.obj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.obj ul{margin:6px 0 0;padding-left:20px;display:grid;gap:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:sticky;top:calc(58px + env(safe-area-inset-top,0px));background:var(--bg);z-index:5;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 14px 11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent-text);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:.72rem;font-family:var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:9px}
.tabs button.on .cnt{background:var(--accent-soft)}
.prose{display:grid;gap:14px;max-width:72ch}
.prose h3{margin-top:12px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:grid;gap:4px}
.prose table{border-collapse:collapse;width:100%;font-size:.93rem}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prose .tblwrap table th,.prose .tblwrap table td,.tbl th,.tbl td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.prose .tblwrap table th,.tbl th{background:var(--grid-head);font-weight:700;font-size:.85rem}
.prose .tblwrap table tr:last-child td{border-bottom:0}
.ui{font-family:var(--f-mono);font-size:.82em;background:var(--accent-soft);color:var(--accent-text);padding:.1em .45em;border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.en{color:var(--muted);font-style:italic;font-size:.92em}
.box{border-radius:var(--r);padding:13px 16px 14px;display:grid;gap:7px;border:1px solid}
.box > .bt{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:7px;align-items:center}
.box ul,.box ol{margin:0;padding-left:20px;display:grid;gap:3px}
.box.retine{background:var(--accent-soft);border-color:transparent}.box.retine .bt{color:var(--accent-text)}
.box.atentie{background:var(--warn-soft);border-color:transparent}.box.atentie .bt{color:var(--warn)}
.box.stiai{background:var(--info-soft);border-color:transparent}.box.stiai .bt{color:var(--info)}
.box.pas{background:var(--surface);border-color:var(--line)}.box.pas .bt{color:var(--ink)}
.box.exemplu{background:var(--surface);border-color:var(--line);border-style:dashed}.box.exemplu .bt{color:var(--muted)}
.term{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.term dt{font-weight:700}.term dd{margin:0;color:var(--ink)}
@media (max-width:560px){.term{grid-template-columns:1fr}.term dd{margin-bottom:6px}}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-x:auto}
.figure figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* ---------- exerciții ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:12px;padding:16px 18px 16px}
.ex.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.ex-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-h .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex-h h4{font-family:var(--f-body);font-size:1.02rem;font-weight:600;line-height:1.4;margin-top:3px}
.badge-ok{flex:none;font-size:.78rem;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:3px 9px;border-radius:99px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--line-strong)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:8px;padding:9px 12px;font-size:.93rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--info-soft);color:var(--info)}
.fb b{font-weight:700}
.sel-list{display:grid;gap:7px}
.sel-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,240px);gap:10px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sel-item.right{border-color:var(--ok)}.sel-item.wrong{border-color:var(--bad)}
@media (max-width:560px){.sel-item{grid-template-columns:1fr}}
.fill-line{line-height:2.3}
.fill-line input{width:clamp(110px,22ch,220px);padding:4px 8px;margin:0 3px}
.fill-line input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill-line input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord{display:grid;gap:6px;counter-reset:o}
.ord li{list-style:none;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg)}
.ord li::before{counter-increment:o;content:counter(o);font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:center}
.ord li.right{border-color:var(--ok)}.ord li.wrong{border-color:var(--bad)}
.ord .mv{display:flex;gap:4px}
.ord .mv button{width:30px;height:28px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer}
.hint{font-size:.88rem;color:var(--muted)}
details.sol{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
details.sol summary{cursor:pointer;font-weight:600;color:var(--accent-text)}

/* ---------- foaie de date (Access) ---------- */
.ds-wrap{border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.ds-scroll{overflow:auto;max-height:430px}
table.ds{border-collapse:collapse;font-size:.88rem;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.ds th{position:sticky;top:0;background:var(--grid-head);font-weight:600;text-align:left;padding:6px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line-strong);white-space:nowrap;z-index:1}
table.ds td{padding:5px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
table.ds td.rs,table.ds th.rs{width:22px;min-width:22px;padding:0;background:var(--grid-head);border-right:1px solid var(--line-strong)}
table.ds td.n{text-align:right}
table.ds tr:hover td:not(.rs){background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.ds th.sortable{cursor:pointer;user-select:none}
table.ds th.sortable:hover{background:var(--sunk)}
table.ds th.csel,table.ds td.csel{background:var(--sel)!important}
table.ds td.cellsel{outline:2px solid var(--accent);outline-offset:-2px}
table.ds td.chg{background:var(--warn-soft);font-weight:600}
table.ds tr.del td:not(.rs){text-decoration:line-through;color:var(--bad)}
.ds-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:5px 10px;border-top:1px solid var(--line-strong);background:var(--grid-head);font-size:.8rem;color:var(--muted)}
.ds-foot .flt{color:var(--accent-text);font-weight:700}
.ds-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.ds-tools .sep{width:1px;height:22px;background:var(--line-strong);margin:0 4px}

/* ---------- grila de proiectare (QBE) ---------- */
.qbe{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.qbe-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.qbe-bar .sep{width:1px;height:24px;background:var(--line-strong);margin:0 3px}
.qbe-bar label{font-size:.84rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.qbe-bar select{padding:5px 7px;font-size:.88rem}
.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.run b{font-size:1.1em}
.qbe-tables{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:14px;background:var(--sunk);border-bottom:1px solid var(--line-strong);min-height:120px;position:relative}
.flist{width:156px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);font-size:.84rem;overflow:hidden}
.flist .t{background:var(--accent);color:var(--accent-ink);padding:4px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.flist .t button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
.flist ul{list-style:none;margin:0;padding:3px 0;max-height:190px;overflow:auto}
.flist li button{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:2px 8px;cursor:pointer;color:var(--ink)}
.flist li button:hover{background:var(--accent-soft)}
.flist .key{color:var(--warn);font-size:.8rem;width:12px}
.add-tbl{align-self:center;display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
.qbe-joins{font-size:.8rem;color:var(--muted);width:100%}
.qgrid-wrap{overflow-x:auto}
table.qgrid{border-collapse:collapse;font-size:.85rem}
table.qgrid th{background:var(--grid-head);text-align:right;padding:4px 10px;font-weight:600;border-bottom:1px solid var(--line);border-right:1px solid var(--line-strong);white-space:nowrap;position:sticky;left:0;z-index:1}
table.qgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;min-width:160px}
table.qgrid td.colh{background:var(--grid-head);height:14px;text-align:center;padding:1px}
table.qgrid td.colh button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0 6px}
table.qgrid td.colh button:hover{color:var(--bad)}
table.qgrid input[type=text],table.qgrid select{border:0;border-radius:0;width:100%;padding:5px 8px;background:transparent;font-family:var(--f-mono);font-size:.83rem}
table.qgrid select{font-family:var(--f-body);font-size:.85rem}
table.qgrid input[type=text]:focus,table.qgrid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
table.qgrid td.cb{text-align:center;padding:4px}
table.qgrid td.cb input{accent-color:var(--accent);width:16px;height:16px}
table.qgrid td.ro{padding:5px 8px;color:var(--muted);font-size:.82rem}
.qbe-params{display:grid;gap:8px;padding:12px 14px;background:var(--warn-soft);border-top:1px solid var(--line)}
.qbe-params .pbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qbe-out{padding:12px 14px;display:grid;gap:10px;border-top:1px solid var(--line-strong)}
.qbe-out .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
pre.sql{margin:0;background:var(--sunk);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:.83rem;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:.92rem}
.warnmsg{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}

/* proiectare tabel */
table.design{border-collapse:collapse;width:100%;font-size:.9rem}
table.design th{background:var(--grid-head);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-strong);font-weight:600}
table.design td{border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:middle}
table.design td.k{width:34px;text-align:center}
table.design td.k input{accent-color:var(--warn)}
table.design tr.right td{background:var(--ok-soft)}table.design tr.wrong td{background:var(--bad-soft)}
.rule-tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:.88rem;display:grid;gap:2px}
.rt .v{font-family:var(--f-mono);font-weight:600}
.rt.right{border-color:var(--ok);background:var(--ok-soft)}.rt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.rt small{color:var(--muted)}

/* formular și raport simulat */
.formsim{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);max-width:560px}
.formsim .fh{background:var(--accent);color:var(--accent-ink);padding:10px 14px;font-family:var(--f-display);font-weight:650;font-size:1.05rem}
.formsim .fd{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;padding:14px;align-items:center;font-size:.92rem}
.formsim .fd label{color:var(--muted);text-align:right}
.formsim .fd .ctl{border:1px solid var(--line-strong);border-radius:5px;padding:4px 8px;background:var(--bg);min-height:30px;font-variant-numeric:tabular-nums}
.formsim .nav{display:flex;gap:4px;align-items:center;padding:6px 10px;background:var(--grid-head);border-top:1px solid var(--line-strong);font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.formsim .nav button{width:30px;height:26px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);cursor:pointer;font-size:.8rem}
.formsim .nav input{width:56px;padding:3px 6px;text-align:center}
.rep{background:#fff;color:#1d1b24;border:1px solid var(--line-strong);border-radius:6px;padding:22px 24px;font-size:.88rem;max-width:720px;box-shadow:var(--shadow)}
.rep h4{font-family:var(--f-display);font-size:1.35rem;margin-bottom:2px;color:#1d1b24}
.rep .rsub{color:#6b6676;font-size:.8rem;margin-bottom:14px}
.rep table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.rep th{text-align:left;border-bottom:1.5px solid #1d1b24;padding:4px 6px;font-size:.8rem}
.rep td{padding:3px 6px}
.rep tr.gh td{font-weight:700;color:#9a1c33;padding-top:12px;border-bottom:1px solid #ddd}
.rep tr.gf td{font-style:italic;border-top:1px dashed #bbb;color:#444}
.rep tr.tot td{font-weight:700;border-top:1.5px solid #1d1b24}
.rep .pf{margin-top:14px;display:flex;justify-content:space-between;color:#6b6676;font-size:.78rem;border-top:1px solid #ddd;padding-top:6px}

/* fișa de lucru */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet-h{padding:18px 22px;border-bottom:1px solid var(--line);display:grid;gap:10px;background:linear-gradient(0deg,var(--surface),var(--bg))}
.sheet-h .who{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sheet-h .who label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
.sheet-b{padding:8px 22px 20px;display:grid;gap:0}
.req{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .rn{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--accent-text);line-height:1.2}
.req .rb{display:grid;gap:8px;min-width:0}
.req .pts{font-size:.78rem;color:var(--muted);font-weight:600}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px}
.teacher{border:1px dashed var(--accent);border-radius:10px;padding:12px 16px;background:var(--accent-soft);display:grid;gap:8px}
.teacher .bt{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}

/* test */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.qcard .qn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--accent-text)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;padding:4px 12px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;font-size:.92rem;z-index:50;box-shadow:var(--shadow)}
.foot{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;color:var(--muted);font-size:.85rem;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:8px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
